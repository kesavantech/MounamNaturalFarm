
{% extends "base.html" %}

{% block content %}

<div class="container-fluid">

    <div class="row">

        <!-- =========================
             SIDEBAR
        ========================= -->
        <div class="col-md-auto p-0">

            {% include "partials/side.html" %}

        </div>


        <!-- =========================
             MAIN CONTENT
        ========================= -->
        <main class="col p-3 p-md-4">

            <!-- Mobile Menu Button -->
            <!--
                This is already handled inside side.html,
                so no extra menu button is required here.
            -->


            <!-- Page Header -->
            <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center mb-4">

                <div>

                    <h2 class="fw-bold mb-1">
                        Dashboard
                    </h2>

                    <p class="text-muted mb-0">
                        Welcome back, {{ request.user.username }}!
                    </p>

                </div>

            </div>


            <!-- =========================
                 DASHBOARD CARDS
            ========================= -->


            <!-- =========================
                 WELCOME SECTION
            ========================= -->
            <div class="card border-0 shadow-sm mt-4">

                <div class="card-body p-4">

                    <h4 class="fw-bold mb-3">
                        Welcome to Mounam Natural Farm
                    </h4>

                    <p class="text-muted mb-0">
                        Manage your account and access your dashboard
                        features from the navigation menu.
                    </p>

                </div>

            </div>

        </main>

    </div>

</div>

{% endblock %}
