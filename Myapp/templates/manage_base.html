{% extends "base.html" %}

{% block content %}

<div class="container-fluid">

    <div class="row g-0">

        <!-- =========================
             SIDEBAR
        ========================= -->
        <div class="col-auto p-0 d-none d-md-block">
            {% include "partials/side.html" %}
        </div>


        <!-- =========================
             MAIN CONTENT
        ========================= -->
        <main class="col-12 col-md p-2 p-sm-3 p-md-4">

            <!-- Page Header -->
            <div class="mb-3 mb-md-4">
                <h2 class="fw-bold mb-1 fs-4 fs-md-2">
                    Website Settings
                </h2>
                <p class="text-muted mb-0 small">
                    Manage your website header and footer settings.
                </p>
            </div>


            <!-- =========================
                 WEBSITE SETTINGS FORM
            ========================= -->
            <div class="card border-0 shadow-sm">

                <div class="card-body p-3 p-md-4">

                    <form method="POST" enctype="multipart/form-data">

                        {% csrf_token %}

                        <!-- =========================
                             LOGO
                        ========================= -->
                        <div class="mb-4">
                            <label for="logo" class="form-label fw-semibold">
                                Website Logo
                            </label>

                            <input
                                type="file"
                                class="form-control"
                                id="logo"
                                name="logo"
                                accept="image/*">

                            {% if website.logo %}
                                <div class="mt-3 text-center text-sm-start">
                                    <p class="text-muted small mb-2">
                                        Current Logo
                                    </p>
                                    <img
                                        src="{{ website.logo.url }}"
                                        alt="Website Logo"
                                        class="img-thumbnail"
                                        style="max-width: 120px; width: 100%; height: auto;">
                                </div>
                            {% endif %}
                        </div>

                        <!-- =========================
                             LOGO RADIUS
                        ========================= -->
                        <div class="mb-4">
                            <label for="logo_radius" class="form-label fw-semibold">
                                Logo Radius
                            </label>
                            <input
                                type="number"
                                class="form-control"
                                id="logo_radius"
                                name="logo_radius"
                                value="{{ website.logo_radius }}"
                                placeholder="Enter Logo Radius"
                                inputmode="numeric">
                        </div>

                        <!-- =========================
                             HEADING
                        ========================= -->
                        <div class="mb-4">
                            <label for="heading" class="form-label fw-semibold">
                                Heading
                            </label>
                            <input
                                type="text"
                                class="form-control"
                                id="heading"
                                name="heading"
                                value="{{ website.heading }}"
                                placeholder="Enter website heading"
                                required>
                        </div>

                        <!-- =========================
                             SUB HEADING
                        ========================= -->
                        <div class="mb-4">
                            <label for="sub_heading" class="form-label fw-semibold">
                                Sub Heading
                            </label>
                            <input
                                type="text"
                                class="form-control"
                                id="sub_heading"
                                name="sub_heading"
                                value="{{ website.sub_heading }}"
                                placeholder="Enter website sub heading">
                        </div>

                        <!-- =========================
                             COLORS
                        ========================= -->
                        <div class="row g-3 mb-4">

                            <!-- Text Color -->
                            <div class="col-6">
                                <label for="text_color" class="form-label fw-semibold small">
                                    Text Color
                                </label>
                                <input
                                    type="color"
                                    class="form-control form-control-color w-100"
                                    id="text_color"
                                    name="text_color"
                                    value="{{ website.text_color }}"
                                    title="Choose text color">
                            </div>

                            <!-- Background Color -->
                            <div class="col-6">
                                <label for="bg_color" class="form-label fw-semibold small">
                                    Background Color
                                </label>
                                <input
                                    type="color"
                                    class="form-control form-control-color w-100"
                                    id="bg_color"
                                    name="bg_color"
                                    value="{{ website.bg_color }}"
                                    title="Choose background color">
                            </div>

                        </div>

                        <!-- =========================
                             FONT SIZE
                        ========================= -->
                        <div class="mb-4">
                            <label for="font_size" class="form-label fw-semibold">
                                Font Size
                            </label>
                            <div class="input-group">
                                <input
                                    type="number"
                                    class="form-control"
                                    id="font_size"
                                    name="font_size"
                                    value="{{ website.font_size }}"
                                    min="8"
                                    max="100"
                                    inputmode="numeric"
                                    required>
                                <span class="input-group-text">px</span>
                            </div>
                        </div>

                        <!-- =========================
                             DESCRIPTION
                        ========================= -->
                        <div class="mb-4">
                            <label for="description" class="form-label fw-semibold">
                                About Mounam Natural Farm
                            </label>
                            <textarea
                                class="form-control"
                                id="description"
                                name="description"
                                rows="5"
                                placeholder="Enter description about Mounam Natural Farm">{{ website.description }}</textarea>
                        </div>

                        <!-- =========================
                             BUTTONS
                        ========================= -->
                        <div class="d-flex flex-column flex-sm-row gap-2 mt-4">
                            <button type="submit" class="btn btn-dark px-4 order-2 order-sm-1 w-100 w-sm-auto">
                                <i class="bi bi-check-circle me-1"></i>
                                Save Changes
                            </button>

                            <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary px-4 order-1 order-sm-2 w-100 w-sm-auto">
                                Cancel
                            </a>
                        </div>

                    </form>

                </div>

            </div>

        </main>

    </div>

</div>

{% endblock %}
