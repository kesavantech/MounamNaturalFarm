
{% extends "base.html" %}

{% block content %}

<div class="container-fluid">

    <div class="row">

        <!-- =========================
             SIDEBAR
        ========================= -->
        <div class="col-auto p-0">

            {% include "partials/side.html" %}

        </div>


        <!-- =========================
             MAIN CONTENT
        ========================= -->
        <main class="col p-3 p-md-4">

            <!-- Page Header -->
            <div class="mb-4">

                <h2 class="fw-bold mb-1">
                    Website Settings
                </h2>

                <p class="text-muted mb-0">
                    Manage your website header and footer settings.
                </p>

            </div>


            <!-- =========================
                 WEBSITE SETTINGS FORM
            ========================= -->
            <div class="card border-0 shadow-sm">

                <div class="card-body p-3 p-md-4">

                    <form
                        method="POST"
                        enctype="multipart/form-data">

                        {% csrf_token %}


                        <!-- =========================
                             LOGO
                        ========================= -->
                        <div class="mb-4">

                            <label
                                for="logo"
                                class="form-label fw-semibold">

                                Website Logo

                            </label>

                            <input
                                type="file"
                                class="form-control"
                                id="logo"
                                name="logo"
                                accept="image/*">

                            {% if website.logo %}

                                <div class="mt-3">

                                    <p class="text-muted small mb-2">
                                        Current Logo
                                    </p>

                                    <img
                                        src="{{ website.logo.url }}"
                                        alt="Website Logo"
                                        class="img-thumbnail"
                                        style="max-width: 150px;">

                                </div>

                            {% endif %}

                        </div>

                         <div class="mb-4">

                            <label
                                for="logo_radius"
                                class="form-label fw-semibold">

                                Heading

                            </label>

                            <input
                                type="number"
                                class="form-control"
                                id="logo_radius"
                                name="logo_radius"
                                value="{{ website.logo_radius }}"
                                placeholder="Enter Logo Radius">

                        </div>

                        <!-- =========================
                             HEADING
                        ========================= -->
                        <div class="mb-4">

                            <label
                                for="heading"
                                class="form-label fw-semibold">

                                Heading

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="heading"
                                name="heading"
                                value="{{ website.heading }}"
                                placeholder="Enter website heading"
                                required>

                        </div>


                        <!-- =========================
                             SUB HEADING
                        ========================= -->
                        <div class="mb-4">

                            <label for="sub_heading"
                                class="form-label fw-semibold">
                                Sub Heading
                            </label>
                            <input
                                type="text"
                                class="form-control"
                                id="sub_heading"
                                name="sub_heading"
                                value="{{ website.sub_heading }}"
                                placeholder="Enter website sub heading">

                        </div>


                        <!-- =========================
                             COLORS
                        ========================= -->
                        <div class="row g-4 mb-4">

                            <!-- Text Color -->
                            <div class="col-12 col-md-6">

                                <label
                                    for="text_color"
                                    class="form-label fw-semibold">

                                    Text Color

                                </label>

                                <input
                                    type="color"
                                    class="form-control form-control-color"
                                    id="text_color"
                                    name="text_color"
                                    value="{{ website.text_color }}"
                                    title="Choose text color">

                            </div>


                            <!-- Background Color -->
                            <div class="col-12 col-md-6">

                                <label
                                    for="bg_color"
                                    class="form-label fw-semibold">

                                    Background Color

                                </label>

                                <input
                                    type="color"
                                    class="form-control form-control-color"
                                    id="bg_color"
                                    name="bg_color"
                                    value="{{ website.bg_color }}"
                                    title="Choose background color">

                            </div>

                        </div>


                        <!-- =========================
                             FONT SIZE
                        ========================= -->
                        <div class="mb-4">

                            <label
                                for="font_size"
                                class="form-label fw-semibold">

                                Font Size

                            </label>

                            <div class="input-group">

                                <input
                                    type="number"
                                    class="form-control"
                                    id="font_size"
                                    name="font_size"
                                    value="{{ website.font_size }}"
                                    min="8"
                                    max="100"
                                    required>

                                <span class="input-group-text">
                                    px
                                </span>

                            </div>

                        </div>

                        <div class="mb-4">

                            <label
                                for="description"
                                class="form-label fw-semibold">

                                About Mounam Natural Farm

                            </label>

                            <textarea
                                class="form-control"
                                id="description"
                                name="description"
                                rows="5"
                                placeholder="Enter description about Mounam Natural Farm">{{ website.description }}</textarea>

                        </div>


                        <!-- =========================
                             BUTTONS
                        ========================= -->
                        <div class="d-flex flex-column flex-sm-row gap-2">

                            <button
                                type="submit"
                                class="btn btn-dark px-4">

                                <i class="bi bi-check-circle me-1"></i>
                                Save Changes

                            </button>

                            <a
                                href="{% url 'dashboard' %}"
                                class="btn btn-outline-secondary px-4">

                                Cancel

                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </main>

    </div>

</div>

{% endblock %}

<!-- 
### One thing we need next

This template expects:

```python
website
```

to be sent from your Django view.

And the form needs a view that:

1. Gets the existing `Website` object.
2. Accepts `POST`.
3. Updates the same object.
4. Saves it.
5. Redirects back to the page.

So **don't create a new `Website` object in the view**. We'll use the existing singleton object and update it.

Your flow will be:

```text
Admin Dashboard
      ↓
Manage Website
      ↓
GET existing Website object
      ↓
Edit form
      ↓
POST
      ↓
Update same ID = 1
      ↓
Save
      ↓
Redirect
```

This keeps your singleton design intact. -->
