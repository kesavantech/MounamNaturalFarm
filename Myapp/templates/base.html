<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
            Mounam Natural Farm
        {% endblock %}
    </title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            padding-top: 76px;
            background-color: #161813;
        }
    </style>

</head>

<style>
    .navbar .nav-link {
    position: relative;
    color: var(--nav-color) !important;
    font-weight: 500;
    padding: 10px 14px !important;
    transition: color 0.3s ease;
}

.navbar .nav-link::after {
    content: "";
    position: absolute;
    bottom: 3px;
    left: 14px;
    width: 0;
    height: 2px;
    background-color: #c3a45c;
    transition: width 0.3s ease;
}

.navbar .nav-link:hover::after,
.navbar .nav-link.active::after {
    width: calc(100% - 28px);
}

.navbar .nav-link:hover,
.navbar .nav-link.active {
    color: #c3a45c !important;
}


/* Footer Navigation */

.footer-link {
    position: relative;
    width: fit-content;
    text-decoration: none;
    color: #c9c9c9;
    font-weight: 400;
    transition: color 0.3s ease;
}

/* Hover and Active */

/* Footer hover and active text color */

.footer-link:hover,
.footer-link.active {
    color: #c3a45c !important;
    font-weight: 600;
}

/* Underline animation */

.footer-link::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: -3px;
    width: 0;
    height: 1.5px;
    background-color: #c3a45c;
    transition: width 0.3s ease;
}

.footer-link:hover::after,
.footer-link.active::after {
    width: 100%;
}

</style>

<body>

    <!-- Header -->
    {% include 'partials/header.html' %}

    <!-- Main Content -->
    {% block content %}
    {% endblock %}

    <!-- Footer -->
    {% include 'partials/footer.html' %}

    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>
    

</body>

</html>
