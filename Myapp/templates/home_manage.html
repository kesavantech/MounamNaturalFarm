{% extends 'base.html' %}

{% block content %}

<div class="container py-4 py-md-5">

    <!-- Page Header -->
    <div class="mb-4">
        <h2 class="fw-bold mb-2">
            Manage Home Page
        </h2>

        <p class="text-muted mb-0">
            Add and manage your Home Page sections.
        </p>
    </div>


    <form method="POST" enctype="multipart/form-data">

        {% csrf_token %}

        <!-- Home Items -->
        <div id="homeItems">

            <!-- Home Item -->
            <div class="home-item card shadow-sm border-0 mb-4">

                <div class="card-header bg-white border-bottom py-3">

                    <div class="d-flex justify-content-between
                                align-items-center gap-2">

                        <h5 class="fw-semibold mb-0">
                            Home Section
                        </h5>

                        <button type="button"
                                class="btn btn-outline-danger btn-sm remove-item">

                            <i class="bi bi-trash"></i>

                            <span class="d-none d-sm-inline">
                                Remove
                            </span>

                        </button>

                    </div>

                </div>


                <div class="card-body p-3 p-md-4">

                    <div class="row g-3">


                        <!-- Main Image -->
                        <div class="col-12">

                            <label class="form-label fw-semibold">
                                Main Image
                            </label>

                            <input
                                type="file"
                                name="main_image"
                                class="form-control"
                                accept="image/*"
                                required
                            >

                            <div class="form-text">
                                Upload the main Home Page image.
                            </div>

                        </div>


                        <!-- Title -->
                        <div class="col-12">

                            <label class="form-label fw-semibold">
                                Title
                            </label>

                            <input
                                type="text"
                                name="title"
                                class="form-control"
                                placeholder="Enter title"
                                required
                            >

                        </div>


                        <!-- Sub Title -->
                        <div class="col-12">

                            <label class="form-label fw-semibold">
                                Sub Title
                            </label>

                            <input
                                type="text"
                                name="sub_title"
                                class="form-control"
                                placeholder="Enter sub title"
                                required
                            >

                        </div>


                        <!-- Bullet Points -->
                        <div class="col-12">

                            <label class="form-label fw-semibold">
                                Bullet Points
                            </label>

                        </div>


                        <!-- Bullet 1 -->
                        <div class="col-12">

                            <div class="input-group">

                                <span class="input-group-text">
                                    1
                                </span>

                                <input
                                    type="text"
                                    name="bullet_point_1"
                                    class="form-control"
                                    placeholder="Enter first bullet point"
                                    required
                                >

                            </div>

                        </div>


                        <!-- Bullet 2 -->
                        <div class="col-12">

                            <div class="input-group">

                                <span class="input-group-text">
                                    2
                                </span>

                                <input
                                    type="text"
                                    name="bullet_point_2"
                                    class="form-control"
                                    placeholder="Enter second bullet point"
                                    required
                                >

                            </div>

                        </div>


                        <!-- Bullet 3 -->
                        <div class="col-12">

                            <div class="input-group">

                                <span class="input-group-text">
                                    3
                                </span>

                                <input
                                    type="text"
                                    name="bullet_point_3"
                                    class="form-control"
                                    placeholder="Enter third bullet point"
                                    required
                                >

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>


        <!-- Add Another Button -->
        <div class="text-center mb-4">

            <button
                type="button"
                id="addItem"
                class="btn btn-outline-primary">

                <i class="bi bi-plus-circle me-1"></i>

                Add Another Home Section

            </button>

        </div>


        <!-- Save Card -->
        <div class="card shadow-sm border-0">

            <div class="card-body p-3 p-md-4">

                <div class="row align-items-center g-3">

                    <div class="col-12 col-md">

                        <h6 class="fw-semibold mb-1">
                            Save Home Page
                        </h6>

                        <small class="text-muted">
                            New content will replace the existing Home Page content.
                        </small>

                    </div>


                    <div class="col-12 col-md-auto">

                        <button
                            type="submit"
                            class="btn btn-success w-100">

                            <i class="bi bi-check-circle me-1"></i>

                            Save Home Page

                        </button>

                    </div>

                </div>

            </div>

        </div>

    </form>

</div>


<script>

    const homeItems = document.getElementById("homeItems");
    const addItemButton = document.getElementById("addItem");


    // Add new Home Section
    addItemButton.addEventListener("click", function () {

        const firstItem = document.querySelector(".home-item");

        const newItem = firstItem.cloneNode(true);


        // Clear input values
        newItem.querySelectorAll("input").forEach(function (input) {

            input.value = "";

        });


        homeItems.appendChild(newItem);

    });


    // Remove Home Section
    homeItems.addEventListener("click", function (event) {

        const removeButton =
            event.target.closest(".remove-item");


        if (!removeButton) {
            return;
        }


        const allItems =
            document.querySelectorAll(".home-item");


        if (allItems.length === 1) {

            alert("At least one Home Section is required.");

            return;

        }


        removeButton
            .closest(".home-item")
            .remove();

    });

</script>

{% endblock %}
