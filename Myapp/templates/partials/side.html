
<!-- Mobile Menu Button -->
<div class="d-md-none mb-3">
    <button
        class="btn btn-dark w-100"
        type="button"
        data-bs-toggle="offcanvas"
        data-bs-target="#dashboardSidebar"
        aria-controls="dashboardSidebar">
        ☰ Menu
    </button>
</div>


<!-- Sidebar -->
<div
    class="offcanvas-md offcanvas-start bg-dark text-white"
    tabindex="-1"
    id="dashboardSidebar"
    aria-labelledby="dashboardSidebarLabel">

    <!-- Mobile Sidebar Header -->
    <div class="offcanvas-header d-md-none">

        <h5
            class="offcanvas-title"
            id="dashboardSidebarLabel">
            Menu
        </h5>

        <button
            type="button"
            class="btn-close btn-close-white"
            data-bs-dismiss="offcanvas"
            aria-label="Close">
        </button>

    </div>

<!-- Sidebar -->

<div
    class="bg-dark text-white min-vh-100 p-3"
    style="width: 250px;">

    {% if request.user.role == "ADMIN" %}

        <!-- Admin Navigation -->

        <h5 class="mb-4">
            Admin Dashboard
        </h5>

        <nav class="nav flex-column">

            <a
                href="{% url 'user_list' %}"
                class="nav-link text-white mb-2">
                Users List
            </a>

            <a
                href="{% url 'manage_base' %}"
                class="nav-link text-white mb-2">
                Manage Bases
            </a>

            <a
                href="{% url 'enquires' %}"
                class="nav-link text-white mb-2">
                Enquiries
            </a>

        </nav>


    {% else %}

        <!-- Client Navigation -->

        <h5 class="mb-4">
            Client Dashboard
        </h5>

        <nav class="nav flex-column">

            <a
                href="{% url 'dashboard' %}"
                class="nav-link text-white mb-2">
                Dashboard
            </a>

            <a
                href="#"
                class="nav-link text-white mb-2">
                Bookings
            </a>

            <a
                href="#"
                class="nav-link text-white mb-2">
                Profile
            </a>

        </nav>

    {% endif %}

</div>


</div>
