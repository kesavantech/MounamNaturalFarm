
{% extends 'base.html' %}

{% block content %}

<div class="container-fluid">
    <div class="row dashboard-row">

        <!-- Admin Sidebar -->
        <div class="col-auto p-0 dashboard-sidebar">
            {% include "partials/side.html" %}
        </div>

        <!-- Main Content -->
        <main class="col py-4 py-md-5">

            <!-- Page Header -->
            <div class="mb-3 mb-md-4">
                <h2 class="fw-bold mb-1 fs-4 fs-md-2">
                    Manage Social Media
                </h2>

                <p class="text-muted mb-0 small">
                    Add social media links to your website footer.
                </p>
            </div>

            <!-- Social Media Form -->
            <div class="card border-0 shadow-sm"
                 style="background-color: {{ website.bg_color }};
                        color: {{ website.text_color }};
                        font-size: {{ website.font_size }}px;">

                <div class="card-body p-3 p-md-4">

                    <form method="POST" action="{% url 'social_media' %}"  enctype="multipart/form-data">
                        {% csrf_token %}

                        <!-- Platform Name -->
                        <div class="mb-4">
                            <label for="name" class="form-label fw-semibold">
                                Platform Name
                                <span class="text-danger">*</span>
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="name"
                                name="name"
                                placeholder="e.g. Instagram"
                                maxlength="50"
                                required>
                        </div>

                        <!-- Profile URL -->
                        <div class="mb-4">
                            <label for="url" class="form-label fw-semibold">
                                Profile URL
                                <span class="text-danger">*</span>
                            </label>

                            <input
                                type="url"
                                class="form-control"
                                id="url"
                                name="url"
                                placeholder="https://www.instagram.com/yourprofile"
                                maxlength="500"
                                required>
                        </div>

                        <!-- Social Media Logo -->
                        <div class="mb-4">
                            <label for="logo" class="form-label fw-semibold">
                                Social Media Logo
                                <span class="text-danger">*</span>
                            </label>

                            <input
                                type="file"
                                class="form-control"
                                id="logo"
                                name="logo"
                                accept="image/*"
                                required>

                            <div class="form-text">
                                Upload the social media platform logo.
                            </div>
                        </div>

                        <!-- Active Status -->
                        <div class="mb-4">
                            <label class="form-label fw-semibold">
                                Display Status
                            </label>

                            <div class="form-check form-switch">
                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    role="switch"
                                    id="is_active"
                                    name="is_active"
                                    checked>

                                <label class="form-check-label"
                                       for="is_active">
                                    Active — display on website
                                </label>
                            </div>
                        </div>

                        <!-- Buttons -->
                        <div class="d-flex flex-column flex-sm-row gap-2 mt-4">

                            <button
                                type="submit"
                                class="btn btn-dark px-4 order-2 order-sm-1 w-100 w-sm-auto">
                                <i class="bi bi-check-circle me-1"></i>
                                Save Social Media
                            </button>

                            <button
                                type="reset"
                                class="btn btn-outline-secondary px-4 order-1 order-sm-2 w-100 w-sm-auto">
                                <i class="bi bi-arrow-counterclockwise me-1"></i>
                                Reset
                            </button>

                        </div>

                    </form>

                </div>
            </div>

        </main>

    </div>
</div>

{% endblock %}
